<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebToolsKita - Index40</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border: 1px solid #263244;
            border-radius: 18px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .icon {
            font-size: 58px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .bridge-box {
            background: #0b1220;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .bridge-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bridge-text {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .button-main {
            background: #2563eb;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .button-main:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .button-back {
            background: #334155;
            color: #ffffff;
        }

        .button-back:hover {
            background: #475569;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🔗</div>

        <h1>WebToolsKita</h1>

        <p class="subtitle">
            Jembatan menuju halaman Index40
        </p>

        <div class="bridge-box">

            <div class="bridge-title">
                Menu Index40
            </div>

            <div class="bridge-text">
                Silakan lanjut ke Index40 untuk membuka
                halaman tujuan WebToolsKita.
            </div>

        </div>

        <a
            href="index40.html"
            class="button button-main"
        >
            🚀 Buka Index40
        </a>

        <a
            href="javascript:history.back()"
            class="button button-back"
        >
            ← Kembali
        </a>

        <div class="footer">
            WebToolsKita • Index38
        </div>

    </div>

</body>
</html>
