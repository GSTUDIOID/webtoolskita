<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - WebToolsKita</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(128, 0, 255, 0.20),
                    transparent 38%
                ),
                #050505;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .admin-icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(120, 0, 255, 0.15);
            border: 2px solid #a855f7;

            font-size: 38px;

            box-shadow:
                0 0 25px rgba(168, 85, 247, 0.35);
        }

        .header h1 {
            font-size: 30px;
            color: #c77dff;
            margin-bottom: 8px;

            text-shadow:
                0 0 20px rgba(168, 85, 247, 0.45);
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .login-box {
            background: rgba(15, 15, 15, 0.95);

            border: 1px solid rgba(168, 85, 247, 0.30);
            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 0 35px rgba(100, 0, 255, 0.12);
        }

        .warning {
            padding: 13px 15px;
            margin-bottom: 22px;

            border-radius: 12px;

            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);

            color: #fbbf24;

            font-size: 13px;
            line-height: 1.5;
        }

        .account-box {
            padding: 18px;
            margin-bottom: 18px;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.025);

            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .account-label {
            color: #777;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .account-name {
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .account-email {
            color: #aaa;
            font-size: 13px;
            word-break: break-word;
        }

        .admin-status {
            margin-top: 14px;

            padding: 11px 12px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.5;
        }

        .admin-status.checking {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.20);
            color: #c084fc;
        }

        .admin-status.allowed {
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #4ade80;
        }

        .admin-status.denied {
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        /* ==========================================
           PASSWORD
           ========================================== */

        .password-box {
            margin-bottom: 18px;
        }

        .password-label {
            display: block;

            color: #777;

            font-size: 12px;

            margin-bottom: 7px;
        }

        .password-input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border: 1px solid rgba(168, 85, 247, 0.25);

            background: rgba(255, 255, 255, 0.035);

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .password-input::placeholder {
            color: #666;
        }

        .password-input:focus {
            border-color: rgba(168, 85, 247, 0.65);

            box-shadow:
                0 0 18px rgba(168, 85, 247, 0.12);
        }

        .password-input:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7e22ce,
                #a855f7
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 0 20px rgba(168, 85, 247, 0.20);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);

            box-shadow:
                0 0 28px rgba(168, 85, 247, 0.35);
        }

        .login-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .logout-btn {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border-radius: 12px;

            border: 1px solid rgba(239, 68, 68, 0.20);

            background: rgba(80, 10, 10, 0.25);

            color: #fca5a5;

            cursor: pointer;

            font-size: 13px;
        }

        .logout-btn:hover {
            background: rgba(120, 20, 20, 0.35);
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.25);

            color: #f87171;
        }

        .message.success {
            display: block;

            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.25);

            color: #4ade80;
        }

        .back-btn {
            display: block;

            width: 100%;

            margin-top: 15px;

            padding: 13px;

            border-radius: 12px;

            border: 1px solid rgba(168, 85, 247, 0.20);

            background: rgba(20, 10, 30, 0.7);

            color: #aaa;

            text-align: center;
            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }

        .back-btn:hover {
            color: white;

            border-color: rgba(168, 85, 247, 0.45);

            background: rgba(80, 20, 120, 0.35);
        }

        .footer {
            text-align: center;

            color: #555;

            font-size: 11px;

            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .login-box {
                padding: 22px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="admin-icon">
            🔐
        </div>

        <h1>Admin Panel</h1>

        <p>
            Verifikasi akses administrator WebToolsKita
        </p>

    </div>


    <div class="login-box">

        <div class="warning">

            ⚠️ <strong>Akses Admin</strong><br>

            Halaman ini khusus untuk administrator
            WebToolsKita.

        </div>


        <div class="account-box">

            <div class="account-label">
                Akun Google yang sedang login
            </div>

            <div
                class="account-name"
                id="userName"
            >
                Memuat...
            </div>

            <div
                class="account-email"
                id="userEmail"
            >
                Memuat...
            </div>

            <div
                id="adminStatus"
                class="admin-status checking"
            >
                ⏳ Memeriksa hak akses admin...
            </div>

        </div>


        <!-- ==========================================
             PASSWORD ADMIN
             ========================================== -->

        <div class="password-box">

            <label
                for="adminPassword"
                class="password-label"
            >
                Password Admin
            </label>

            <input
                type="password"
                id="adminPassword"
                class="password-input"
                placeholder="Masukkan password admin"
                autocomplete="off"
                disabled
            >

        </div>


        <button
            type="button"
            class="login-btn"
            id="loginButton"
            disabled
        >
            ⏳ Memeriksa Akses...
        </button>


        <button
            type="button"
            class="logout-btn hidden"
            id="logoutButton"
        >
            🚪 Logout Google
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index3.html"
            class="back-btn"
        >
            ← Kembali ke Menu
        </a>

    </div>


    <div class="footer">
        WebToolsKita v1.0.0
    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>


<script>

    // ==========================================
    // FIREBASE
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDzy3RyDI97j_tZFQHBLNookXDyLh18Yf8",

        authDomain:
            "webtoolskita.firebaseapp.com",

        projectId:
            "webtoolskita",

        storageBucket:
            "webtoolskita.firebasestorage.app",

        messagingSenderId:
            "593680487717",

        appId:
            "1:593680487717:web:33ef7a4bc9be02f99276cc",

        measurementId:
            "G-YVEJ90678G"
    };


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    // ==========================================
    // ADMIN
    // ==========================================

    const ADMIN_EMAIL =
        "ganreffafk@gmail.com";


    // ==========================================
    // PASSWORD ADMIN
    // ==========================================
    //
    // EDIT PASSWORD DI SINI.
    //
    // Contoh:
    //
    // const ADMIN_PASSWORD =
    //     "admin12345";
    //
    // Tidak perlu edit server.js.
    //
    // ==========================================

    const ADMIN_PASSWORD =
        "WEBSTUDIOID_1672026";


    // ==========================================
    // RETURN URL
    // ==========================================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const requestedReturnTo =
        urlParams.get("returnTo");


    function getReturnUrl() {

        if (!requestedReturnTo) {

            return "index18.html";
        }


        try {

            const decoded =
                decodeURIComponent(
                    requestedReturnTo
                );


            /*
                Hanya izinkan halaman lokal.
                Tidak boleh redirect ke domain luar.
            */

            if (
                decoded.startsWith("/") &&
                !decoded.startsWith("//") &&
                !decoded.includes("://")
            ) {

                return decoded;
            }


            if (
                decoded.endsWith(".html") &&
                !decoded.includes("://") &&
                !decoded.startsWith("//")
            ) {

                return decoded;
            }

        } catch (error) {

            console.error(
                "Return URL error:",
                error
            );
        }


        return "index18.html";
    }


    // ==========================================
    // ELEMENT
    // ==========================================

    const userName =
        document.getElementById("userName");

    const userEmail =
        document.getElementById("userEmail");

    const adminStatus =
        document.getElementById("adminStatus");

    const adminPassword =
        document.getElementById("adminPassword");

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const message =
        document.getElementById("message");


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(type, text) {

        message.className =
            "message " + type;

        message.textContent =
            text;
    }


    function clearMessage() {

        message.className =
            "message";

        message.textContent =
            "";
    }


    // ==========================================
    // UI STATE
    // ==========================================

    function checkingState() {

        adminStatus.className =
            "admin-status checking";

        adminStatus.textContent =
            "⏳ Memeriksa hak akses admin...";

        loginButton.disabled =
            true;

        loginButton.textContent =
            "⏳ Memeriksa Akses...";

        adminPassword.disabled =
            true;
    }


    function allowedState() {

        adminStatus.className =
            "admin-status allowed";

        adminStatus.textContent =
            "✅ Akses administrator terverifikasi oleh server.";

        loginButton.disabled =
            false;

        loginButton.textContent =
            "🔓 Buka Admin Dashboard";

        adminPassword.disabled =
            false;

        adminPassword.focus();
    }


    function deniedState() {

        adminStatus.className =
            "admin-status denied";

        adminStatus.textContent =
            "❌ Akun ini tidak memiliki hak akses administrator.";

        loginButton.disabled =
            true;

        loginButton.textContent =
            "🚫 Akses Ditolak";

        adminPassword.disabled =
            true;
    }


    // ==========================================
    // VERIFIKASI SERVER
    // ==========================================

    async function verifyAdmin(user) {

        try {

            checkingState();

            clearMessage();


            const token =
                await user.getIdToken(true);


            const response =
                await fetch(
                    "/api/admin/test",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            const data =
                await response
                    .json()
                    .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Server menolak akses admin."
                );
            }


            allowedState();

            logoutButton.classList.remove(
                "hidden"
            );


            return true;

        } catch (error) {

            console.error(
                "Admin verification:",
                error
            );


            deniedState();

            logoutButton.classList.remove(
                "hidden"
            );


            showMessage(
                "error",
                "❌ " +
                (
                    error.message ||
                    "Akses admin ditolak."
                )
            );


            return false;
        }
    }


    // ==========================================
    // PASSWORD
    // ==========================================

    function verifyPassword() {

        const enteredPassword =
            adminPassword.value;


        if (!enteredPassword) {

            showMessage(
                "error",
                "❌ Silakan masukkan password admin."
            );

            adminPassword.focus();

            return false;
        }


        if (
            String(enteredPassword) !==
            String(ADMIN_PASSWORD)
        ) {

            showMessage(
                "error",
                "❌ Password admin salah."
            );

            adminPassword.value = "";

            adminPassword.focus();

            return false;
        }


        return true;
    }


    // ==========================================
    // SERVER ADMIN GATE
    // ==========================================

    async function createAdminGate(user) {

        try {

            const token =
                await user.getIdToken(true);


            const response =
                await fetch(
                    "/api/admin/gate",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Authorization":
                                "Bearer " + token,

                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            returnTo:
                                getReturnUrl()
                        })
                    }
                );


            const data =
                await response
                    .json()
                    .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Server gagal membuat akses admin."
                );
            }


            return true;

        } catch (error) {

            console.error(
                "Admin gate error:",
                error
            );


            showMessage(
                "error",
                "❌ " +
                (
                    error.message ||
                    "Gagal membuat sesi admin."
                )
            );


            return false;
        }
    }


    // ==========================================
    // GOOGLE AUTH
    // ==========================================

    auth.onAuthStateChanged(
        async (user) => {

            if (!user) {

                window.location.href =
                    "index2.html";

                return;
            }


            userName.textContent =
                user.displayName ||
                "User WebToolsKita";


            userEmail.textContent =
                user.email ||
                "Email tidak tersedia";


            logoutButton.classList.remove(
                "hidden"
            );


            /*
                Pemeriksaan client hanya
                sebagai pemeriksaan awal.

                Server tetap menjadi sumber
                keputusan akses admin.
            */

            if (
                !user.email ||
                user.email.toLowerCase() !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                deniedState();

                showMessage(
                    "error",
                    "❌ Akun Google ini bukan akun administrator WebToolsKita."
                );

                return;
            }


            await verifyAdmin(user);

        }
    );


    // ==========================================
    // BUKA DASHBOARD
    // ==========================================

    loginButton.addEventListener(
        "click",
        async () => {

            const user =
                auth.currentUser;


            if (!user) {

                window.location.href =
                    "index2.html";

                return;
            }


            clearMessage();


            loginButton.disabled =
                true;

            loginButton.textContent =
                "⏳ Memverifikasi...";


            /*
                STEP 1
                Verifikasi ulang admin
                melalui server.
            */

            const allowed =
                await verifyAdmin(user);


            if (!allowed) {
                return;
            }


            /*
                STEP 2
                Verifikasi password.
            */

            const passwordOK =
                verifyPassword();


            if (!passwordOK) {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "🔓 Buka Admin Dashboard";

                return;
            }


            /*
                STEP 3
                Buat admin gate cookie
                melalui server.
            */

            loginButton.disabled =
                true;

            adminPassword.disabled =
                true;

            loginButton.textContent =
                "⏳ Membuat Sesi Admin...";


            const gateCreated =
                await createAdminGate(user);


            if (!gateCreated) {

                loginButton.disabled =
                    false;

                adminPassword.disabled =
                    false;

                loginButton.textContent =
                    "🔓 Buka Admin Dashboard";

                return;
            }


            /*
                Kompatibilitas dengan
                index18 versi lama.

                Ini BUKAN sumber keamanan.
                Server tetap menjadi sumber
                keputusan akses.
            */

            sessionStorage.setItem(
                "webtoolskita_admin",
                "true"
            );


            showMessage(
                "success",
                "✅ Akses admin terverifikasi. Membuka halaman..."
            );


            loginButton.textContent =
                "✅ Akses Diterima";


            setTimeout(() => {

                window.location.href =
                    getReturnUrl();

            }, 500);

        }
    );


    // ==========================================
    // ENTER = LOGIN
    // ==========================================

    adminPassword.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !loginButton.disabled
            ) {

                loginButton.click();
            }

        }
    );


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutButton.addEventListener(
        "click",
        async () => {

            try {

                sessionStorage.removeItem(
                    "webtoolskita_admin"
                );


                await auth.signOut();


                window.location.href =
                    "index2.html";

            } catch (error) {

                console.error(
                    "Logout error:",
                    error
                );


                showMessage(
                    "error",
                    "❌ Gagal logout."
                );

            }

        }
    );

</script>

</body>
</html>
