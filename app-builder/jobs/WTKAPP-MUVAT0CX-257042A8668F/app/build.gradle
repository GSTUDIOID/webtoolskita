plugins {
    id 'com.android.application'
}

def wtkStorePassword = project.findProperty("webtoolskita.storePassword")
def wtkKeyPassword = project.findProperty("webtoolskita.keyPassword")
def wtkKeystoreFile = file("${System.getProperty('user.home')}/WebToolsKita/signing/webtoolskita-release.jks")

android {
    namespace 'com.webtoolskita.appbuilder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webtoolskita.generated'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile wtkKeystoreFile
            storePassword wtkStorePassword
            keyAlias 'webtoolskita'
            keyPassword wtkKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
}
